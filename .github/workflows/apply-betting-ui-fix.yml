name: Apply betting UI fix

on:
  push:
    branches: [Kehitys]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Kehitys
          fetch-depth: 0
      - name: Apply betting UI
        env:
          SECTION_B64: 
        run: |
          python - <<'PY'
          import base64, zlib, pathlib
          p = pathlib.Path('mm_veikkaus.py')
          s = p.read_text()
          section = zlib.decompress(base64.b64decode(__import__('os').environ['SECTION_B64'])).decode()
          a = s.index('# ====================== VEIKKAUSKISA ======================')
          b = s.index('# ====================== VEIKKAUSTILANNE ======================')
          s = s[:a] + section + s[b:]
          s = s.replace('pred_type = st.selectbox("Veikkaustyyppi", ["normal", "nhl"], key="new_pred_type")', 'pred_type = st.selectbox("Veikkaustyyppi", ["normal", "1x2", "moniveto", "moniveto_hockey", "moniveto_football", "nhl"], key="new_pred_type")')
          p.write_text(s)
          PY
          python -m py_compile mm_veikkaus.py
          rm -f .github/workflows/apply-betting-ui-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mm_veikkaus.py .github/workflows/apply-betting-ui-fix.yml
          git commit -m "fix: player-selected betting tokens and game modes"
          git push
