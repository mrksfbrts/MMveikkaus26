name: Apply contest admin integration

on:
  push:
    branches: [Kehitys]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[auto-contest-admin]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Kehitys
          fetch-depth: 0

      - name: Patch application
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('mm_veikkaus.py')
          text = path.read_text(encoding='utf-8')

          old = 'from scoring import calculate_match_points\n'
          new = old + 'from contest_admin import render_contest_admin\n'
          if 'from contest_admin import render_contest_admin' not in text:
              if old not in text:
                  raise SystemExit('Import anchor not found')
              text = text.replace(old, new, 1)

          old = '''    c.execute('''CREATE TABLE IF NOT EXISTS list_settings (\n    list_key TEXT PRIMARY KEY,\n    double_points INTEGER DEFAULT 0,\n    double_marks INTEGER DEFAULT 0,\n    joker_count INTEGER DEFAULT 0\n)''')\n'''
          new = old + '''    # Laajenna list_settings-taulua dynaamisia kisoja varten.\n    for col, ddl in [\n        ("list_name", "TEXT DEFAULT ''"),\n        ("pred_type", "TEXT DEFAULT 'normal'"),\n        ("sort_order", "INTEGER DEFAULT 0"),\n    ]:\n        try:\n            c.execute(f"ALTER TABLE list_settings ADD COLUMN {col} {ddl}")\n        except Exception:\n            pass\n'''
          if 'ALTER TABLE list_settings ADD COLUMN list_name' not in text:
              if old not in text:
                  raise SystemExit('list_settings anchor not found')
              text = text.replace(old, new, 1)

          marker = 'seed_matches_if_empty()\n\n@st.cache_data(ttl=30)\n'
          insert = '''def ensure_list_settings():\n    """Luo asetusrivit myös vanhoille seed-listoille ja olemassa oleville ottelulistoille."""\n    with get_db() as conn:\n        rows = conn.execute(\n            "SELECT list_key, MAX(list_name) AS list_name, MAX(pred_type) AS pred_type, "\n            "MIN(sort_order) AS first_order, SUM(CASE WHEN is_double=1 THEN 1 ELSE 0 END) AS double_count "\n            "FROM matches GROUP BY list_key"\n        ).fetchall()\n        for r in rows:\n            dc = int(r["double_count"] or 0)\n            conn.execute(\n                "INSERT OR IGNORE INTO list_settings "\n                "(list_key, list_name, pred_type, double_points, double_marks, joker_count, sort_order) "\n                "VALUES (?,?,?,?,?,?,?)",\n                (r["list_key"], r["list_name"], r["pred_type"] or "normal", 1 if dc else 0, dc, 0, int(r["first_order"] or 0)),\n            )\n        conn.commit()\n\nensure_list_settings()\n\n@st.cache_data(ttl=30)\n'''
          if 'def ensure_list_settings()' not in text:
              if marker not in text:
                  raise SystemExit('seed/load anchor not found')
              text = text.replace(marker, marker.replace('@st.cache_data(ttl=30)\n', '') + insert, 1)

          pattern = r'@st\.cache_data\(ttl=30\)\ndef load_all_match_lists\(\):.*?\ndef get_match_lists\(\):'
          replacement = '''@st.cache_data(ttl=30)\ndef load_all_match_lists():\n    """Palauttaa [(list_name, matches_list), ...] myös tyhjille uusille listoille."""\n    with get_db() as conn:\n        settings_rows = conn.execute(\n            "SELECT * FROM list_settings ORDER BY sort_order, list_key"\n        ).fetchall()\n        rows = conn.execute(\n            "SELECT * FROM matches ORDER BY sort_order, id"\n        ).fetchall()\n\n    lists = {}\n    order_keys = []\n    for s in settings_rows:\n        key = s["list_key"]\n        lists[key] = {\n            "name": s["list_name"] or key,\n            "pred_type": s["pred_type"] or "normal",\n            "matches": [],\n        }\n        order_keys.append(key)\n\n    for r in rows:\n        key = r["list_key"]\n        if key not in lists:\n            lists[key] = {"name": r["list_name"], "pred_type": r["pred_type"], "matches": []}\n            order_keys.append(key)\n        start = datetime.fromisoformat(r["start_iso"]).replace(tzinfo=HELSINKI)\n        lists[key]["matches"].append({\n            "id": r["id"],\n            "home": r["home"],\n            "away": r["away"],\n            "aika": r["aika"],\n            "start": start,\n            "double": bool(r["is_double"]),\n            "pred_type": r["pred_type"],\n            "list_key": key,\n        })\n\n    return [(lists[k]["name"], lists[k]["matches"]) for k in order_keys], lists\n\ndef get_match_lists():'''
          new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'load_all_match_lists replacement failed: {count}')
          text = new_text

          old = '''         ["Käyttäjien hallinta", "Tulosten syöttö", "Pistekorjaukset", "Listabonukset",\n         "Otteluiden hallinta", "Varmuuskopiointi & palautus", "Keskustelu"],'''
          new = '''         ["Käyttäjien hallinta", "Tulosten syöttö", "Pistekorjaukset", "Listabonukset",\n         "Kisojen hallinta", "Otteluiden hallinta", "Varmuuskopiointi & palautus", "Keskustelu"],'''
          if '"Kisojen hallinta"' not in text:
              if old not in text:
                  raise SystemExit('admin radio anchor not found')
              text = text.replace(old, new, 1)

          marker = '    elif admin_tab == "Otteluiden hallinta":\n'
          insert = '''    elif admin_tab == "Kisojen hallinta":\n        render_contest_admin(st, get_db, clear_matches_cache, clear_points_cache)\n\n'''
          if 'elif admin_tab == "Kisojen hallinta"' not in text:
              if marker not in text:
                  raise SystemExit('admin branch anchor not found')
              text = text.replace(marker, insert + marker, 1)

          old = '''            else:\n                list_name = lists_by_key.get(list_key, {}).get("name") or SEED_MATCHES.get(list_key, {}).get("name", list_key)\n                pred_type = lists_by_key.get(list_key, {}).get("pred_type") or SEED_MATCHES.get(list_key, {}).get("pred_type", "normal")\n                st.text(f"Lista: {list_name} · Tyyppi: {pred_type}")\n\n            mid = st.text_input("Ottelun ID (uniikki, esim. l1_15)", key="new_mid")\n'''
          new = '''            else:\n                list_name = lists_by_key.get(list_key, {}).get("name") or SEED_MATCHES.get(list_key, {}).get("name", list_key)\n                pred_type = lists_by_key.get(list_key, {}).get("pred_type") or SEED_MATCHES.get(list_key, {}).get("pred_type", "normal")\n                st.text(f"Lista: {list_name} · Tyyppi: {pred_type}")\n\n            with get_db() as conn:\n                contest_cfg = conn.execute(\n                    "SELECT double_points, double_marks, joker_count FROM list_settings WHERE list_key=?",\n                    (list_key,),\n                ).fetchone()\n            double_enabled = bool(contest_cfg["double_points"]) if contest_cfg else True\n            double_limit = int(contest_cfg["double_marks"]) if contest_cfg else 0\n            current_double_count = sum(1 for mm in lists_by_key.get(list_key, {}).get("matches", []) if mm.get("double"))\n            if contest_cfg:\n                st.caption(\n                    f"Kisan asetukset: tuplapisteet {'käytössä' if double_enabled else 'pois'} · "\n                    f"tuplakohteita {double_limit} · jokereita {int(contest_cfg['joker_count'])}"\n                )\n\n            mid = st.text_input("Ottelun ID (uniikki, esim. l1_15)", key="new_mid")\n'''
          if 'current_double_count = sum' not in text:
              if old not in text:
                  raise SystemExit('new match config anchor not found')
              text = text.replace(old, new, 1)

          old = '            is_double = st.checkbox("Tuplapisteet", key="new_double")\n'
          new = '            is_double = st.checkbox("Tuplapisteet", key="new_double", disabled=not double_enabled)\n'
          text = text.replace(old, new, 1)

          old = '''                else:\n                    try:\n                        datetime.fromisoformat(start_str)\n                        with get_db() as conn:\n'''
          new = '''                else:\n                    try:\n                        datetime.fromisoformat(start_str)\n                        if is_double and (not double_enabled or (double_limit and current_double_count >= double_limit)):\n                            st.error(f"Tuplakohteiden enimmäismäärä ({double_limit}) on jo käytetty tässä kisassa.")\n                            st.stop()\n                        with get_db() as conn:\n'''
          if 'Tuplakohteiden enimmäismäärä' not in text:
              if old not in text:
                  raise SystemExit('new match save anchor not found')
              text = text.replace(old, new, 1)

          # Add settings to the JSON export without changing the existing match format.
          old = '''        for key, info in (lists_by_key or {}).items():\n            export_data[key] = {\n                "name": info["name"],\n                "pred_type": info["pred_type"],\n'''
          new = '''        for key, info in (lists_by_key or {}).items():\n            with get_db() as conn:\n                cfg = conn.execute("SELECT double_points, double_marks, joker_count FROM list_settings WHERE list_key=?", (key,)).fetchone()\n            export_data[key] = {\n                "name": info["name"],\n                "pred_type": info["pred_type"],\n                "settings": {\n                    "double_points": int(cfg["double_points"]) if cfg else 0,\n                    "double_marks": int(cfg["double_marks"]) if cfg else 0,\n                    "joker_count": int(cfg["joker_count"]) if cfg else 0,\n                },\n'''
          if '"settings": {' not in text:
              if old not in text:
                  raise SystemExit('export anchor not found')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          print('Patched mm_veikkaus.py')
          PY

      - name: Commit changes and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mm_veikkaus.py contest_admin.py .github/workflows/apply-contest-admin.yml
          git rm .github/workflows/apply-contest-admin.yml
          git commit -m "Add contest creation and settings [auto-contest-admin]"
          git push origin HEAD:Kehitys
