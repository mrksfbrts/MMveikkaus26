name: Integrate contest management

on:
  push:
    branches: [Kehitys]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[auto-contest-admin]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Kehitys
          fetch-depth: 0

      - name: Patch application
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('mm_veikkaus.py')
          text = path.read_text(encoding='utf-8')

          # Import the new admin module.
          anchor = 'from scoring import calculate_match_points\n'
          imp = 'from contest_admin import render_contest_admin\n'
          if imp not in text:
              if anchor not in text:
                  raise SystemExit('scoring import anchor missing')
              text = text.replace(anchor, anchor + imp, 1)

          # Extend list_settings without breaking existing databases.
          marker = "    c.execute('''CREATE TABLE IF NOT EXISTS list_settings (\n    list_key TEXT PRIMARY KEY,\n    double_points INTEGER DEFAULT 0,\n    double_marks INTEGER DEFAULT 0,\n    joker_count INTEGER DEFAULT 0\n)''')\n"
          ddl = marker + '''\n    for col, definition in [\n        ("list_name", "TEXT DEFAULT ''"),\n        ("pred_type", "TEXT DEFAULT 'normal'"),\n        ("sort_order", "INTEGER DEFAULT 0"),\n    ]:\n        try:\n            c.execute(f"ALTER TABLE list_settings ADD COLUMN {col} {definition}")\n        except Exception:\n            pass\n'''
          if 'ALTER TABLE list_settings ADD COLUMN list_name' not in text:
              if marker not in text:
                  raise SystemExit('list_settings anchor missing')
              text = text.replace(marker, ddl, 1)

          # Make list loading include newly-created empty contests.
          start = text.find('def load_all_match_lists():')
          end = text.find('\ndef get_match_lists():', start)
          if start < 0 or end < 0:
              raise SystemExit('load_all_match_lists boundaries missing')
          new_loader = '''def load_all_match_lists():\n    """Load both legacy match lists and newly created empty contests."""\n    with get_db() as conn:\n        settings = conn.execute(\n            "SELECT list_key, COALESCE(list_name,'') AS list_name, COALESCE(pred_type,'normal') AS pred_type, COALESCE(sort_order,0) AS sort_order FROM list_settings ORDER BY sort_order, list_key"\n        ).fetchall()\n        rows = conn.execute("SELECT * FROM matches ORDER BY sort_order, id").fetchall()\n\n    lists = {}\n    order_keys = []\n    for s in settings:\n        key = s["list_key"]\n        lists[key] = {"name": s["list_name"] or key, "pred_type": s["pred_type"] or "normal", "matches": []}\n        order_keys.append(key)\n\n    for r in rows:\n        key = r["list_key"]\n        if key not in lists:\n            lists[key] = {"name": r["list_name"], "pred_type": r["pred_type"], "matches": []}\n            order_keys.append(key)\n        start_dt = datetime.fromisoformat(r["start_iso"]).replace(tzinfo=HELSINKI)\n        lists[key]["matches"].append({\n            "id": r["id"], "home": r["home"], "away": r["away"], "aika": r["aika"],\n            "start": start_dt, "double": bool(r["is_double"]), "pred_type": r["pred_type"], "list_key": key,\n        })\n    return [(lists[k]["name"], lists[k]["matches"]) for k in order_keys], lists\n'''
          text = text[:start] + new_loader + text[end:]

          # Add the new admin tab.
          old_tabs = '["Käyttäjien hallinta", "Tulosten syöttö", "Pistekorjaukset", "Listabonukset",\n         "Otteluiden hallinta", "Varmuuskopiointi & palautus", "Keskustelu"]'
          new_tabs = '["Käyttäjien hallinta", "Tulosten syöttö", "Pistekorjaukset", "Listabonukset",\n         "Kisojen hallinta", "Otteluiden hallinta", "Varmuuskopiointi & palautus", "Keskustelu"]'
          if '"Kisojen hallinta"' not in text:
              if old_tabs not in text:
                  raise SystemExit('admin tabs anchor missing')
              text = text.replace(old_tabs, new_tabs, 1)

          # Add the branch immediately before match management.
          branch = '''    elif admin_tab == "Kisojen hallinta":\n        render_contest_admin(st, get_db, clear_matches_cache, clear_points_cache)\n\n'''
          anchor_branch = '    elif admin_tab == "Otteluiden hallinta":\n'
          if 'elif admin_tab == "Kisojen hallinta"' not in text:
              if anchor_branch not in text:
                  raise SystemExit('admin branch anchor missing')
              text = text.replace(anchor_branch, branch + anchor_branch, 1)

          path.write_text(text, encoding='utf-8')
          print('Contest management integration patched successfully')
          PY

      - name: Commit integration and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mm_veikkaus.py contest_admin.py
          git rm .github/workflows/apply-contest-admin.yml
          git commit -m "Add contest management to admin [auto-contest-admin]"
          git push origin HEAD:Kehitys
