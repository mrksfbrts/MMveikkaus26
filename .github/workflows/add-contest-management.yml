name: Add contest management

on:
  push:
    branches: [Kehitys]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[contest-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch contest management
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('mm_veikkaus.py')
          s = p.read_text(encoding='utf-8')

          old = '''    c.execute('''CREATE TABLE IF NOT EXISTS list_settings (\n    list_key TEXT PRIMARY KEY,\n    double_points INTEGER DEFAULT 0,\n    double_marks INTEGER DEFAULT 0,\n    joker_count INTEGER DEFAULT 0\n)''')'''
          new = '''    c.execute('''CREATE TABLE IF NOT EXISTS list_settings (\n    list_key TEXT PRIMARY KEY,\n    double_points INTEGER DEFAULT 0,\n    double_marks INTEGER DEFAULT 0,\n    joker_count INTEGER DEFAULT 0,\n    moniveto_results INTEGER DEFAULT 0\n)''')\n    try:\n        c.execute("ALTER TABLE list_settings ADD COLUMN moniveto_results INTEGER DEFAULT 0")\n    except Exception:\n        pass'''
          if old not in s:
              raise SystemExit('list_settings anchor not found')
          s = s.replace(old, new, 1)

          old = '''def clear_matches_cache():\n    load_all_match_lists.clear()\n\n# ====================== APUFUNKTIOT ======================'''
          new = '''def clear_matches_cache():\n    load_all_match_lists.clear()\n\n\ndef get_list_settings(list_key):\n    with get_db() as conn:\n        row = conn.execute("SELECT * FROM list_settings WHERE list_key=?", (list_key,)).fetchone()\n    if row:\n        return dict(row)\n    return {"list_key": list_key, "double_points": 0, "double_marks": 0, "joker_count": 0, "moniveto_results": 0}\n\n\ndef save_list_settings(list_key, double_points=0, double_marks=0, joker_count=0, moniveto_results=0):\n    with get_db() as conn:\n        conn.execute(\n            "INSERT OR REPLACE INTO list_settings (list_key,double_points,double_marks,joker_count,moniveto_results) VALUES (?,?,?,?,?)",\n            (list_key, int(double_points), int(double_marks), int(joker_count), int(moniveto_results))\n        )\n    clear_points_cache()\n\n\ndef count_user_extra_1x2(username, list_key):\n    with get_db() as conn:\n        rows = conn.execute("SELECT prediction FROM predictions WHERE username=? AND is_special=0", (username,)).fetchall()\n    total = 0\n    for r in rows:\n        try:\n            p = json.loads(r["prediction"])\n            if p.get("kind") == "1x2":\n                total += max(0, len(p.get("mark_opts", [])) - 1)\n        except Exception:\n            pass\n    return total\n\n\ndef count_user_jokers(username, list_key):\n    _, by_key = load_all_match_lists()\n    mids = {m["id"] for m in by_key.get(list_key, {}).get("matches", [])}\n    with get_db() as conn:\n        rows = conn.execute("SELECT match_id,prediction FROM predictions WHERE username=? AND is_special=0", (username,)).fetchall()\n    total = 0\n    for r in rows:\n        if str(r["match_id"]) not in mids:\n            continue\n        try:\n            p = json.loads(r["prediction"])\n            if p.get("kind") == "moniveto" and p.get("joker"):\n                total += 1\n        except Exception:\n            pass\n    return total\n\n# ====================== APUFUNKTIOT ======================'''
          if old not in s:
              raise SystemExit('cache anchor not found')
          s = s.replace(old, new, 1)

          old = '''        ["Käyttäjien hallinta", "Tulosten syöttö", "Pistekorjaukset", "Listabonukset",\n         "Otteluiden hallinta", "Varmuuskopiointi & palautus", "Keskustelu"],'''
          new = '''        ["Käyttäjien hallinta", "Tulosten syöttö", "Pistekorjaukset", "Listabonukset",\n         "Kisojen hallinta", "Otteluiden hallinta", "Varmuuskopiointi & palautus", "Keskustelu"],'''
          if old not in s:
              raise SystemExit('admin tabs anchor not found')
          s = s.replace(old, new, 1)

          marker = '''    elif admin_tab == "Otteluiden hallinta":\n'''
          if marker not in s:
              raise SystemExit('admin management anchor not found')

          block = '''    elif admin_tab == "Kisojen hallinta":\n        st.write("### 🎯 Kisojen hallinta")\n        st.caption("Luo erillisiä Tulosveto-, 1X2- ja Moniveto-kisoja. Ottelut lisätään tämän jälkeen Otteluiden hallinta -kohdasta.")\n\n        with st.expander("➕ Luo uusi kisa", expanded=True):\n            ck1, ck2 = st.columns(2)\n            with ck1:\n                new_key = st.text_input("Kisan avain", placeholder="esim. nhl_moniveto_1", key="contest_new_key")\n                new_name = st.text_input("Kisan nimi", placeholder="esim. NHL-moniveto", key="contest_new_name")\n            with ck2:\n                new_type = st.selectbox("Pelityyppi", ["Tulosveto", "1X2", "Moniveto"], key="contest_new_type")\n                sport = st.selectbox("Laji", ["Jääkiekko", "Jalkapallo"], key="contest_sport")\n\n            dp = dm = jc = mr = 0\n            if new_type == "Tulosveto":\n                dp = st.number_input("Tuplapistekohteita", min_value=0, max_value=50, value=0, step=1, key="contest_dp")\n                st.caption("Tuplapistekohteet merkitään ottelukohtaisesti Otteluiden hallinta -näkymässä.")\n            elif new_type == "1X2":\n                dm = st.number_input("Tuplamerkkien määrä / pelaaja", min_value=0, max_value=50, value=0, step=1, key="contest_dm")\n                st.caption("Pelaaja saa itse päättää, mihin kohteisiin ylimääräiset merkit käyttää.")\n            else:\n                mr = 4 if sport == "Jääkiekko" else 2\n                st.number_input("Tulosvaihtoehtoja / kohde", min_value=1, max_value=10, value=mr, step=1, key="contest_mr")\n                mr = st.session_state.get("contest_mr", mr)\n                jc = st.number_input("Jokerien määrä / pelaaja", min_value=0, max_value=50, value=0, step=1, key="contest_jc")\n                st.caption("Jokainen jokeri on yksi ylimääräinen tarkka tulos, jonka pelaaja saa käyttää valitsemaansa kohteeseen.")\n\n            if st.button("Luo kisa", type="primary", key="contest_create"):\n                if not new_key.strip() or not new_name.strip():\n                    st.error("Anna sekä kisan avain että nimi.")\n                else:\n                    with get_db() as conn:\n                        exists = conn.execute("SELECT 1 FROM matches WHERE list_key=? LIMIT 1", (new_key.strip(),)).fetchone()\n                    if exists:\n                        st.error("Tämän avaimen kisa on jo olemassa.")\n                    else:\n                        pred_map = {"Tulosveto":"normal", "1X2":"1x2", "Moniveto":"moniveto"}\n                        save_list_settings(new_key.strip(), dp, dm, jc, mr)\n                        st.session_state["contest_created_notice"] = new_name.strip()\n                        st.session_state["contest_created_type"] = pred_map[new_type]\n                        st.success(f"Kisa '{new_name.strip()}' asetettu luotavaksi. Lisää sille ensimmäinen ottelu Otteluiden hallinta -kohdasta valitsemalla uusi lista.")\n                        st.rerun()\n\n        st.markdown("---")\n        st.write("#### Nykyisten kisojen asetukset")\n        all_lists, lists_by_key = load_all_match_lists()\n        if not all_lists:\n            st.info("Ei vielä kisoja.")\n        else:\n            for lname, matches in all_lists:\n                key = matches[0]["list_key"] if matches else None\n                if not key:\n                    continue\n                settings = get_list_settings(key)\n                ptype = matches[0].get("pred_type", "normal")\n                label = {"normal":"Tulosveto", "1x2":"1X2", "moniveto":"Moniveto", "nhl":"Vanha NHL"}.get(ptype, ptype)\n                with st.expander(f"{lname} · {label}"):\n                    st.write(f"**Avain:** `{key}`")\n                    if ptype == "1x2":\n                        st.write(f"Tuplamerkkejä / pelaaja: **{settings.get('double_marks', 0)}**")\n                    elif ptype == "moniveto":\n                        st.write(f"Tulosvaihtoehtoja / kohde: **{settings.get('moniveto_results', 0)}** · Jokereita / pelaaja: **{settings.get('joker_count', 0)}**")\n                    else:\n                        st.write(f"Tuplapistekohteita: **{settings.get('double_points', 0)}**")\n                    st.caption(f"Otteluita: {len(matches)}")\n\n'''
          s = s.replace(marker, block + marker, 1)

          marker = '''        for ti, (name, matches) in enumerate(all_lists):\n            with tabs[ti]:\n                pred_type = matches[0]["pred_type"] if matches else "normal"\n                if pred_type == "nhl":\n                    for m in matches:\n                        render_nhl_match(m)\n                else:\n                    for m in matches:\n                        render_normal_match(m, f"l{ti}")\n'''
          replacement = '''        def render_1x2_match(m, list_key):\n            now = datetime.now(HELSINKI)\n            is_closed = now >= m["start"]\n            saved = load_prediction(st.session_state.logged_in_user, m["id"])\n            has = saved and saved.get("kind") == "1x2"\n            settings = get_list_settings(list_key)\n            allowed_extra = int(settings.get("double_marks", 0))\n            used_extra = count_user_extra_1x2(st.session_state.logged_in_user, list_key)\n            max_marks = 2 if allowed_extra > used_extra or (has and len(saved.get("mark_opts", [])) > 1) else 1\n            st.markdown(f"### {m['home']} – {m['away']}")\n            st.caption(m["aika"])\n            with st.container(border=True):\n                if is_closed:\n                    st.markdown(f"**Tallennettu:** {', '.join(saved.get('mark_opts', [])) if has else 'Ei veikkausta'}")\n                else:\n                    opts = st.multiselect("Valitse merkki(t)", ["1","X","2"], default=saved.get("mark_opts", []) if has else [], max_selections=max_marks, key=f"1x2_opts_{m['id']}")\n                    extra_before = max(0, len(saved.get("mark_opts", []))-1) if has else 0\n                    extra_available = allowed_extra - (used_extra - extra_before)\n                    st.caption(f"Tuplamerkkejä käytössä: {max(0, used_extra-extra_before)}/{allowed_extra} · Tälle kohteelle ylimääräinen merkki: {'kyllä' if extra_available > 0 else 'ei'}")\n                    if st.button("Päivitä veikkaus" if has else "Tallenna veikkaus", type="primary" if not has else "secondary", key=f"1x2_save_{m['id']}", use_container_width=True):\n                        if not opts:\n                            st.error("Valitse vähintään yksi merkki.")\n                        elif len(opts) > 1 and extra_available <= 0:\n                            st.error("Tuplamerkit on käytetty.")\n                        else:\n                            save_prediction(st.session_state.logged_in_user, m["id"], {"kind":"1x2", "mark_opts":opts})\n                            clear_points_cache()\n                            st.toast("Veikkaus tallennettu!")\n                            st.rerun()\n\n        def render_moniveto_match(m, list_key):\n            now = datetime.now(HELSINKI)\n            is_closed = now >= m["start"]\n            saved = load_prediction(st.session_state.logged_in_user, m["id"])\n            has = saved and saved.get("kind") == "moniveto"\n            settings = get_list_settings(list_key)\n            base_n = int(settings.get("moniveto_results", 0)) or 4\n            joker_limit = int(settings.get("joker_count", 0))\n            used_jokers = count_user_jokers(st.session_state.logged_in_user, list_key)\n            scores = [f"{h}-{a}" for h in range(0,13) for a in range(0,13)]\n            st.markdown(f"### {m['home']} – {m['away']}")\n            st.caption(m["aika"])\n            with st.container(border=True):\n                if is_closed:\n                    if has:\n                        base = ", ".join(saved.get("results", [])) or "–"\n                        joker = f" · Joker: {saved.get('joker')}" if saved.get("joker") else ""\n                        st.markdown(f"**Tallennettu:** {base}{joker}")\n                    else:\n                        st.markdown("Ei veikkausta")\n                else:\n                    defaults = saved.get("results", []) if has else []\n                    selected = st.multiselect(f"Valitse {base_n} mahdollista tarkkaa tulosta", scores, default=defaults, max_selections=base_n, key=f"mv_scores_{m['id']}")\n                    extra_used_before = 1 if has and saved.get("joker") else 0\n                    joker_allowed = joker_limit - (used_jokers - extra_used_before)\n                    joker_default = saved.get("joker") if has else None\n                    joker_choices = ["Ei jokeria"] + [x for x in scores if x not in selected]\n                    joker = st.selectbox("Jokeri – yksi ylimääräinen tarkka tulos", joker_choices, index=(joker_choices.index(joker_default) if joker_default in joker_choices else 0), key=f"mv_joker_{m['id']}")\n                    st.caption(f"Jokereita käytössä: {max(0, used_jokers-extra_used_before)}/{joker_limit}")\n                    if st.button("Päivitä veikkaus" if has else "Tallenna veikkaus", type="primary" if not has else "secondary", key=f"mv_save_{m['id']}", use_container_width=True):\n                        if len(selected) != base_n:\n                            st.error(f"Valitse tasan {base_n} tulosta.")\n                        elif joker != "Ei jokeria" and joker_allowed <= 0:\n                            st.error("Jokerit on käytetty.")\n                        else:\n                            save_prediction(st.session_state.logged_in_user, m["id"], {"kind":"moniveto", "results":selected, "joker":None if joker == "Ei jokeria" else joker})\n                            clear_points_cache()\n                            st.toast("Veikkaus tallennettu!")\n                            st.rerun()\n\n        for ti, (name, matches) in enumerate(all_lists):\n            with tabs[ti]:\n                pred_type = matches[0]["pred_type"] if matches else "normal"\n                list_key = matches[0]["list_key"] if matches else ""\n                if pred_type == "nhl":\n                    for m in matches:\n                        render_nhl_match(m)\n                elif pred_type == "1x2":\n                    for m in matches:\n                        render_1x2_match(m, list_key)\n                elif pred_type == "moniveto":\n                    for m in matches:\n                        render_moniveto_match(m, list_key)\n                else:\n                    for m in matches:\n                        render_normal_match(m, f"l{ti}")\n'''
          if marker not in s:
              raise SystemExit('prediction dispatch anchor not found')
          s = s.replace(marker, replacement, 1)

          # Make new-list creation in Otteluiden hallinta aware of the new contest types.
          old = '                pred_type = st.selectbox("Veikkaustyyppi", ["normal", "nhl"], key="new_pred_type")'
          new = '                pred_type = st.selectbox("Veikkaustyyppi", ["normal", "1x2", "moniveto", "nhl"], key="new_pred_type")'
          if old not in s:
              raise SystemExit('new match type anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          print('patched', p)
          PY

      - name: Commit patched app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mm_veikkaus.py .github/workflows/add-contest-management.yml
          git commit -m 'Add contest management and prediction types [contest-ui]'
          git push origin HEAD:Kehitys
