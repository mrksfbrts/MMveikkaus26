name: Apply betting UI redesign

on:
  push:
    branches:
      - Kehitys
    paths:
      - '.ui-redesign-trigger'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Kehitys
          fetch-depth: 0

      - name: Patch app
        run: python scripts/patch_betting_ui.py

      - name: Check syntax
        run: python -m py_compile mm_veikkaus.py

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mm_veikkaus.py
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'fix: simplify 1X2 and moniveto entry UI'
            git push origin Kehitys
          fi
