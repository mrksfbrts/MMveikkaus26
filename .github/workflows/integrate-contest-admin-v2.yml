name: Integrate contest management v2

on:
  push:
    branches: [Kehitys]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[auto-contest-admin-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Kehitys
          fetch-depth: 0

      - name: Patch application
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('mm_veikkaus.py')
          text = path.read_text(encoding='utf-8')

          if 'from contest_admin import render_contest_admin' not in text:
              anchor = 'from scoring import calculate_match_points'
              if anchor not in text:
                  raise SystemExit('Could not find scoring import')
              text = text.replace(anchor, anchor + '\nfrom contest_admin import render_contest_admin', 1)

          if 'ALTER TABLE list_settings ADD COLUMN list_name' not in text:
              marker = """    c.execute('''CREATE TABLE IF NOT EXISTS list_settings (\n    list_key TEXT PRIMARY KEY,\n    double_points INTEGER DEFAULT 0,\n    double_marks INTEGER DEFAULT 0,\n    joker_count INTEGER DEFAULT 0\n)''')"""
              if marker not in text:
                  raise SystemExit('Could not find list_settings table')
              extra = marker + '''\n\n    for col, definition in [\n        ("list_name", "TEXT DEFAULT ''"),\n        ("pred_type", "TEXT DEFAULT 'normal'"),\n        ("sort_order", "INTEGER DEFAULT 0"),\n    ]:\n        try:\n            c.execute(f"ALTER TABLE list_settings ADD COLUMN {col} {definition}")\n        except Exception:\n            pass\n'''
              text = text.replace(marker, extra, 1)

          start = text.find('def load_all_match_lists():')
          end = text.find('\ndef get_match_lists():', start)
          if start == -1 or end == -1:
              raise SystemExit('Could not find load_all_match_lists function')
          old_loader = text[start:end]
          if 'SELECT list_key, COALESCE(list_name' not in old_loader:
              new_loader = '''def load_all_match_lists():\n    with get_db() as conn:\n        settings = conn.execute(\n            "SELECT list_key, COALESCE(list_name,'') AS list_name, COALESCE(pred_type,'normal') AS pred_type, COALESCE(sort_order,0) AS sort_order FROM list_settings ORDER BY sort_order, list_key"\n        ).fetchall()\n        rows = conn.execute("SELECT * FROM matches ORDER BY sort_order, id").fetchall()\n    lists = {}\n    order_keys = []\n    for s in settings:\n        key = s["list_key"]\n        lists[key] = {"name": s["list_name"] or key, "pred_type": s["pred_type"] or "normal", "matches": []}\n        order_keys.append(key)\n    for r in rows:\n        key = r["list_key"]\n        if key not in lists:\n            lists[key] = {"name": r["list_name"], "pred_type": r["pred_type"], "matches": []}\n            order_keys.append(key)\n        start_dt = datetime.fromisoformat(r["start_iso"]).replace(tzinfo=HELSINKI)\n        lists[key]["matches"].append({\n            "id": r["id"], "home": r["home"], "away": r["away"], "aika": r["aika"],\n            "start": start_dt, "double": bool(r["is_double"]), "pred_type": r["pred_type"], "list_key": key,\n        })\n    return [(lists[k]["name"], lists[k]["matches"]) for k in order_keys], lists\n'''
              text = text[:start] + new_loader + text[end:]

          if '"Kisojen hallinta"' not in text:
              tabs = '["Käyttäjien hallinta", "Tulosten syöttö", "Pistekorjaukset", "Listabonukset",\n         "Otteluiden hallinta", "Varmuuskopiointi & palautus", "Keskustelu"]'
              if tabs not in text:
                  raise SystemExit('Could not find admin tabs')
              text = text.replace(tabs, tabs.replace('"Otteluiden hallinta"', '"Kisojen hallinta", "Otteluiden hallinta"'), 1)

          if 'elif admin_tab == "Kisojen hallinta":' not in text:
              anchor = '    elif admin_tab == "Otteluiden hallinta":'
              if anchor not in text:
                  raise SystemExit('Could not find match admin branch')
              text = text.replace(anchor, '    elif admin_tab == "Kisojen hallinta":\n        render_contest_admin(st, get_db, clear_matches_cache, clear_points_cache)\n\n' + anchor, 1)

          path.write_text(text, encoding='utf-8')
          print('integration complete')
          PY

          grep -q 'from contest_admin import render_contest_admin' mm_veikkaus.py
          grep -q '"Kisojen hallinta"' mm_veikkaus.py
          grep -q 'elif admin_tab == "Kisojen hallinta":' mm_veikkaus.py
          python -m py_compile mm_veikkaus.py contest_admin.py
          git diff --check
          git diff -- mm_veikkaus.py

      - name: Commit and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mm_veikkaus.py contest_admin.py
          git rm .github/workflows/integrate-contest-admin-v2.yml
          git commit -m "Add contest management UI [auto-contest-admin-v2]"
          git push origin HEAD:Kehitys
